<!DOCTYPE html>
<html lang="en">
	<head>
		<style>
			:root {background-color: #eff1f5; color: #4c4f69;}
			@media (prefers-contrast: more) {
				:root {background-color: #eff1f5; color: black;}
			}
			@media (prefers-color-scheme: dark) {
				:root {background-color: #24273a; color: #cad3f5;}
				@media (prefers-contrast: more) {
					:root {background-color: #11111b; color: white;}
				}
				@media (prefers-contrast: less) {
					:root {background-color: #303446; color: #c6d0f5;}
				}
			}
		</style>
		<script src="coi-serviceworker.min.js"></script>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Intransitive Analysis</title>
		<link rel="icon" href="./assets/favicon.ico">
		<link rel="icon" href="./assets/favicon.svg">
		<script>
			'use strict';
			window.getSystemTheme = () => matchMedia
					? matchMedia('(prefers-color-scheme: dark)').matches
						? matchMedia('(prefers-contrast: less)').matches
							? 'frappe'
							: matchMedia('(prefers-contrast: more)').matches ? 'black' : 'macchiato'
						: matchMedia('(prefers-contrast: more)').matches ? 'cream' : 'latte'
					: 'latte';
			document.documentElement.setAttribute(
				'theme',
				localStorage.getItem(location.pathname + ':theme') || getSystemTheme()
			);
		</script>
		<link rel="stylesheet" href="./index.css">
	</head>
	<body>
		<noscript>
			<h1>This page requires JavaScript be enabled to function.</h1>
		</noscript>
		<div id="outer" style="display: none;">
			<div id="cursor-anchor"></div>
			<div id="moves-ctxmenu" class="contextmenu"><menu>
				<button id="m-force-var">Force into variation</button>
				<hr>
				<button id="m-del">Delete from here</button>
			</menu></div>
			<div id="vmoves-ctxmenu" class="contextmenu"><menu>
				<button id="vm-promote">Promote variation</button>
				<button id="vm-to-main">Promote to mainline</button>
				<button id="vm-top">Move to top</button>
				<button id="vm-up">Move up</button>
				<button id="vm-down">Move down</button>
				<button id="vm-bottom">Move to bottom</button>
				<hr>
				<button id="vm-del">Delete from here</button>
			</menu></div>
			<div class="sidebar-outer">
				<div class="sidebar">
					<button class="bar-item"><svg class="icon" id="settings" viewBox="0 0 1 1">
						<use href="./assets/gear.svg" x="0" y="0" width="1" height="1" />
					</svg></button>
					<div class="sidebar-content" id="settings-content"><div>
						<p>Theme:</p>
						<select id="theme">
							<option value>(System)</option>
							<option value="latte">Light</option>
							<option value="frappe">Soft</option>
							<option value="macchiato">Dark</option>
							<option value="mocha">Night</option>
							<option value="cream">Light&#8239;&#9681;</option>
							<option value="black">Dark&#8239;&#9681;</option>
						</select>
					</div></div>
				</div>
			</div>
			<div class="board-outer">
				<div id="board"></div>
				<div class="arrows-outer">
					<div class="arrows-shell">
						<svg id="arrows" viewBox="-0.5 -0.5 9 9">
							<defs id="arrowheads" />
							<g id="arrows-inner" />
						</svg>
					</div>
				</div>
			</div>
			<div class="analysis-outer">
				<div class="analysis">
					<div class="moves-outer"><div id="moves"></div></div>
				</div>
			</div>
		</div>
		<script type="module">
			document.getElementById('outer').style.cssText = '';
			let markers = '';
			for (let i = 0; i < 8; i++) {
				markers += `<marker id="arrowhead-${i}" orient="auto" overflow="visible">`
						+ `<path d="M 0.95 0 l -3 2 v -4 Z" fill="var(--color-${i})" />`
					+ '</marker>';
			}
			document.getElementById('arrowheads').innerHTML = markers;
			document.getElementById('theme').value
				= localStorage.getItem(location.pathname + ':theme') || '';
		</script>
		<script type="module" src="./index.js" defer></script>
	</body>
</html>
