<!DOCTYPE html>
<html lang="en">
	<head>
		<style>
			:root {
				background-color: #eff1f5;
				color: #4c4f69;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					background-color: #1e1e2e;
					color: #cdd6f4;
				}
			}
		</style>
		<script src="coi-serviceworker.min.js"></script>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Intransitive Analysis</title>
		<link rel="icon" href="./assets/favicon.ico">
		<link rel="icon" href="./assets/favicon.svg">
		<script>
			'use strict';
			let theme = localStorage.getItem(location.pathname + ':theme');
			switch (theme) {
				default:
					if (!window.matchMedia) {
						throw Error('Couldn\'t get system theme.');
					}
					theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'mocha' : 'latte';
				case 'latte':
				case 'mocha':
			}
			document.documentElement.setAttribute('theme', theme);
		</script>
		<link rel="stylesheet" href="./index.css">
	</head>
	<body>
		<noscript>
			<h1>This page requires JavaScript be enabled to function.</h1>
		</noscript>
		<div id="outer"></div>
		<script>document.getElementById('outer').innerHTML = `
			<div id="cursor-anchor"></div>
			<div id="moves-ctxmenu" class="contextmenu"><menu>
				<button id="m-force-var">Force into variation</button>
				<hr>
				<button id="m-del">Delete from here</button>
			</menu></div>
			<div id="vmoves-ctxmenu" class="contextmenu"><menu>
				<button id="vm-promote">Promote variation</button>
				<button id="vm-to-main">Promote to mainline</button>
				<button id="vm-top">Move to top</button>
				<button id="vm-up">Move up</button>
				<button id="vm-down">Move down</button>
				<button id="vm-bottom">Move to bottom</button>
				<hr>
				<button id="vm-del">Delete from here</button>
			</menu></div>
			<div class="sidebar-outer">
				<div class="sidebar">
					<div class="bar-item"><div class="icon" id="settings"></div></div>
				</div>
			</div>
			<div class="board-outer">
				<div id="board">
					${[...Array(81)].map(() => '<div class="cell"></div>').join('')}
				</div>
				<div class="arrows-outer">
					<div class="arrows-shell">
						<svg id="arrows" viewBox="-0.5 -0.5 9 9">
							<defs>
								${[...Array(8)].map((_, i) => `
									<marker
										id="arrowhead-${i}"
										orient="auto"
										overflow="visible"
									>
										<path d="M 0.95 0 l -3 2 v -4 Z" fill="var(--color-${i})" />
									</marker>
								`).join('')}
							</defs>
							<g id="arrows-inner" />
						</svg>
					</div>
				</div>
			</div>
			<div class="analysis-outer">
				<div class="analysis">
					<div class="moves-outer"><div id="moves"></div></div>
				</div>
			</div>
		`;</script>
		<script type="module" src="./index.js" defer></script>
	</body>
</html>
